# Render Blueprint for DecepShield AI's backend.
# In Render: New -> Blueprint -> point at this repo -> it reads this file.
# After the service is created, set the secret env vars (JWT_SECRET, MONGO_URI,
# GEMINI_API_KEY, OAuth client id/secrets, HONEYPOT_INGEST_KEY, FRONTEND_URL,
# BACKEND_URL) in the Render dashboard -- do not commit real secrets here.
services:
  - type: web
    name: decepshield-api
    runtime: node
    rootDir: API
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        sync: false
      - key: MONGO_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: HONEYPOT_INGEST_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
